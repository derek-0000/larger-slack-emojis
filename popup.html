<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Larger Slack Emojis</title>
    <style></style>
  </head>
  <body>
    <h4>larger-custom-slack-emojis</h4>
    <main>
      <div class="c-toggle">
        <label for="toggle" class="custom-size-toggle-label"
          >Toggle custom emoji size</label
        >
        <input type="checkbox" id="toggle" class="custom-size-toggle" />
      </div>
      <div class="c-toggle">
        <label for="toggle">Custom emoji size</label>
        <input
          type="text"
          id="custom-size-unit"
          class="custom-size-input"
          placeholder="px, rem, em, etc"
        />
      </div>
    </main>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 20px;
        background-color: #202020;
        color: #f9fafb;
      }
      main {
        min-width: 20rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-top: 1rem;
      }
      .c-toggle {
        display: flex;
        flex-direction: row;
        gap: 0.5rem;
        font-size: 12px;
        align-items: center;
      }
      .custom-size-input {
        display: flex;
        height: 40px;
        border-radius: 6px;
        border: 1px solid #525252;
        background-color: #202020;
        padding: 0 12px;
        font-size: 14px;
        line-height: 1.5rem;
        color: #f9fafb;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .custom-size-input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
      }

      .custom-size-input::placeholder {
        color: #9ca3af;
      }

      .custom-size-toggle {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        width: 16px;
        height: 16px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        background-color: white;
        display: inline-block;
        vertical-align: middle;
        cursor: pointer;
        transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
      }

      .custom-size-toggle:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
        outline: none;
      }

      .custom-size-toggle:checked {
        background-color: #3b82f6;
        border-color: #3b82f6;
        background-image: url("data:image/svg+xml;utf8,<svg fill='none' viewBox='0 0 24 24' stroke='white' xmlns='http://www.w3.org/2000/svg'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='3' d='M5 13l4 4L19 7'/></svg>");
        background-position: center;
        background-repeat: no-repeat;
        background-size: 12px 12px;
      }
    </style>
    <script src="popup.js"></script>
  </body>
</html>
